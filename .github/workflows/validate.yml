name: Validate Training Journal
on:
  push:
    branches: [main, training-journal-update]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-journal-validation
          path: test-results/
